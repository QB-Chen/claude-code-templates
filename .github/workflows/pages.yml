name: Deploy agent catalog to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "cli-tool/components/**"
      - "cli-tool/templates/**"
      - "scripts/generate_agent_catalog.py"
      - "site/**"
      - "AGENTS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-agent-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate agent catalog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/generate_agent_catalog.py

      - name: Ensure Pages assets
        run: |
          touch site/.nojekyll
          cp AGENTS.md site/AGENTS.md 2>/dev/null || true

      # enablement: true creates the Pages site if not configured yet
      # (fixes: Get Pages site failed / HttpError Not Found)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
