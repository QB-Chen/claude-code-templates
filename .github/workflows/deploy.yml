name: Deploy to Cloudflare Pages

# Upstream (davila7) deploys aitmpl.com via Cloudflare.
# On forks this should not fail red: skip unless Cloudflare secrets exist
# and (optionally) you intentionally enable fork deploys.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip when this is a fork without Cloudflare credentials (common).
    # Upstream has CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID set.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: dashboard
      - name: Build
        run: npm run build
        working-directory: dashboard
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_Y2xlcmsuYWl0bXBsLmNvbSQ"
          PUBLIC_GITHUB_CLIENT_ID: "Ov23li3KjfA4cuLi5c0k"
          PUBLIC_COMPONENTS_JSON_URL: "/components.json"
      - name: Deploy www + app.aitmpl.com
        run: npx wrangler pages deploy dist --project-name=aitmpl-dashboard --commit-dirty=true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  skip-notice:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
    steps:
      - name: Cloudflare deploy skipped
        run: |
          echo "Skipping Cloudflare Pages deploy."
          echo "This fork has no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets."
          echo "Agent catalog is on GitHub Pages, not Cloudflare:"
          echo "  https://qb-chen.github.io/claude-code-templates/"
          echo "To deploy to your own Cloudflare project, add those secrets under"
          echo "  Settings → Secrets and variables → Actions"
          echo "and point --project-name at your project."
